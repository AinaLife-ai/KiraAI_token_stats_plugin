<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="180" height="180" rx="36" fill="url(#bg)"/>
  <!-- 环形：缓存命中率弧 -->
  <circle cx="90" cy="90" r="52" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="11"/>
  <circle cx="90" cy="90" r="52" fill="none" stroke="url(#ring)" stroke-width="11" stroke-linecap="round" stroke-dasharray="238 89" transform="rotate(-90 90 90)" filter="url(#glow)"/>
  <!-- 环内 T -->
  <text x="90" y="103" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="46" font-weight="800" fill="#ffffff">T</text>
  <!-- 上升折线 + 数据点 -->
  <path d="M38 134 L68 114 L98 122 L140 88" fill="none" stroke="url(#up)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M122 88 L140 88 L140 106" fill="none" stroke="url(#up)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="38" cy="134" r="4.5" fill="#fbbf24"/>
  <circle cx="98" cy="122" r="4.5" fill="#fbbf24"/>
  <circle cx="140" cy="88" r="5.5" fill="#fbbf24"/>
  <!-- 缓存命中高亮 -->
  <circle cx="90" cy="36" r="5" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="131" cy="54" r="3.5" fill="#34d399"/>
</svg>
